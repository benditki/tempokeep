<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <style>*{ box-sizing:border-box;margin:0;padding:0;touch-action:none;}.record-name{ font-size:18px;font-weight:bold;margin-bottom:8px;}.grid-container{ display:grid;grid-auto-flow:column; grid-auto-columns:1fr; width:100%;height:30px; padding:0;margin:0;gap:0;max-width:600px;}.grid-cell{ display:flex;align-items:center;justify-content:center;margin:0;padding:0;height:100%;width:100%;border:1px solid #777474;background-color:#333;cursor:pointer;}.grid-cell.active{ background-color:#4caf50;}.grid-cell.highlight{ background-color:#ffeb3b;}.controls-container{ margin-top:10px;}button{ margin-right:5px;padding:5px 10px;cursor:pointer;}.player-container{ margin-bottom:20px;border:1px solid #ddd;padding:10px;background-color:#f9f9f9;border-radius:8px;}.timeline{ display:flex;align-items:center;justify-content:center;width:100%;height:30px;padding:0;margin:0;max-width:600px;position:relative;--offset:0 }.tick-container{ position:relative;width:100%;height:100%;background:#fdfdfd;border-bottom:1px solid #ccc;}.tick{ position:absolute;top:0;width:1px;height:12px;background:black;left:calc((var(--pos) + var(--offset)) * 100%);transform:translateX(-50%);}.note{ position:absolute;width:2px;top:50%;height:100%;background:none;left:calc((var(--pos) + var(--offset)) * 100%);transform:translate(-50%, -50%);display:flex;align-items:center;justify-content:center;}.circle::before{ content:'●';font-size:130%;}.dotted_circle::before{ content:'◌';font-size:95%;}.connector{ position:absolute;top:0;height:2px;background:black;left:calc((var(--start) + var(--offset)) * 100%);width:calc((var(--end) - var(--start)) * 100%);}</style> <title>Rhythm Memorization App</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script> </head> <body> <h1>Rhythm Memorization App</h1> <div id="player-container-1" class="player-container"></div> <div id="player-container-2" class="player-container"></div> <div id="player-container-3" class="player-container"></div> <script>const symbols={dotted_circle:"◌",circle:"●",square:"■",triangle:"▲",diamond:"◆",cross:"✖",star:"★",bottom_bar:"▄"};</script> <script>const settings={active_color:"#778822",inactive_color:"#aaaaaa",playing_color:"#aabb33",schedule_ahead_time:.1};</script> <script>function el(tag, attributes = {}, ...children) { 
    const element = document.createElement(tag); 
    for (const [key, value] of Object.entries(attributes)) { 
        if (key === "class") { 
            element.className = value; 
        } else if (key === "dataset") { 
            Object.assign(element.dataset, value); 
        } else if (key.startsWith("on") && typeof value === "function") { 
            element.addEventListener(key.slice(2).toLowerCase(), value); 
        } else if (key.startsWith("--")) { 
            element.style.setProperty(key, value); 
        } else { 
            element.setAttribute(key, value); 
        } 
    } 
    for (const child of children) { 
        if (typeof child === "string") { 
            element.appendChild(document.createTextNode(child)); 
        } else if (child instanceof Node) { 
            element.appendChild(child); 
        } 
    } 
    return element; 
}</script> <script>class Audio { 
    constructor() { 
        this.context = new (window.AudioContext || window.webkitAudioContext)(); 
        this.buffers = {}; // Stores loaded audio buffers 
    } 
 
    // Load a single audio buffer 
    async loadBuffer(url) { 
        const response = await fetch(url); 
        const arrayBuffer = await response.arrayBuffer(); 
        return this.context.decodeAudioData(arrayBuffer); 
    } 
 
    // Load multiple audio buffers 
    async loadFiles(bufferMap) { 
        for (const [name, url] of Object.entries(bufferMap)) { 
            this.buffers[name] = await this.loadBuffer(url); 
            console.log(`Loaded audio buffer: ${name}`); 
        } 
    } 
 
    // Start a buffer at an absolute time 
    startBuffer(name, time) { 
        if (!this.buffers[name]) { 
            console.error(`Audio buffer '${name}' not loaded`); 
            return; 
        } 
 
        const source = this.context.createBufferSource(); 
        source.buffer = this.buffers[name]; 
        source.connect(this.context.destination); 
        source.start(time); // Use absolute time to schedule playback 
 
        console.log(`Playing '${name}' buffer at absolute time ${time.toFixed(4)}s`); 
        return source; 
    } 
};</script> <script>class Record { 
    constructor(name, soundName, beatsPerBar, stepsPerBeat, activeSteps = []) { 
        this.name = name; // Record name 
        this.soundName = soundName; // Name of the sound buffer 
        this.beatsPerBar = beatsPerBar; 
        this.stepsPerBeat = stepsPerBeat; 
        this.activeSteps = activeSteps; 
    } 
 
    get totalSteps() { 
        return this.beatsPerBar * this.stepsPerBeat; 
    } 
 
    getStepState(step) { 
        return this.activeSteps.includes(step); 
    } 
 
    toggleStep(step) { 
        if (this.activeSteps.includes(step)) { 
            this.activeSteps = this.activeSteps.filter((s) => s !== step); 
        } else { 
            this.activeSteps.push(step); 
        } 
    } 
}</script> <script>class Player { 
    constructor(bpm, record, containerSelector, audio) { 
        this.bpm = bpm; 
        this.record = record; 
        this.noteInterval = this.calculateNoteInterval(); 
        this.audio = audio; 
        // this.lastStartStep = 0; 
        // this.lastStartTime = 0.0; 
        this.nextStep = 0; 
        this.nextNoteTime = 0.0; 
        this.isPlaying = false; 
        this.isPaused = false; 
        // this.pauseOffset = 0.0; 
        // this.scheduleTimeouts = []; 
        // this.scheduledAudioNodes = []; 
        this.intervalId = null; 
        this.lastHightlightedStep = null; 
        this.lastPauseTime = 0.0; 
 
        // Set the container for the player 
        this.container = document.querySelector(containerSelector); 
        if (!this.container) { 
            throw new Error(`Container '${containerSelector}' not found.`); 
        } 
 
        // Create the grid and controls 
        // this.createGrid(); 
        this.createTicks(); 
        this.createControls(); 
        this.showRecordName(); 
    } 
 
    calculateNoteInterval() { 
        return (60.0 / this.bpm) / this.record.stepsPerBeat; 
    } 
 
    get currentTime() { 
        return this.audio.context.currentTime 
    } 
 
    // Display the record name in the UI 
    showRecordName() { 
        const nameElement = el("div", { class: "record-name" }, `Record: ${this.record.name}`); 
        this.container.prepend(nameElement); 
    } 
 
    createTicks() { 
        const step = 1 / this.record.totalSteps; 
        const offset = 0.5 * step; 
        const wrap = (x) => ((x + offset) % 1) - offset; 
        const is_active = (i) => this.record.getStepState(i); 
        const ticksContainer = el("div", { class: "ticks-container" }, 
            ...Array.from({ length: this.record.totalSteps }, (_, i) => 
                el("div", { class: "tick", "--pos": wrap(i * step) }) 
            ), 
            ...Array.from({ length: this.record.totalSteps }, (_, i) => 
                el("div", { class: "note", "--pos": wrap(i * step) }, is_active(i) ? el('div', { class: 'circle draggable' }) : el('div', { class: 'dotted_circle' })) 
            ), 
            ...Array.from({ length: this.record.beatsPerBar }, (_, i) => 
                el("div", { class: "connector", "--start": i/this.record.beatsPerBar, "--end": (i+1)/this.record.beatsPerBar - step }) 
            ) 
        ); 
        const timeline = el("div", { class: "timeline", "--offset": offset }, ticksContainer); 
        this.container.appendChild(timeline); 
    } 
 
    createGrid() { 
        this.container.innerHTML = ""; // Clear any existing content 
        const gridContainer = document.createElement("div"); 
        gridContainer.className = "grid-container"; 
 
        for (let i = 0; i < this.record.totalSteps; i++) { 
            const cell = document.createElement("div"); 
            cell.classList.add("grid-cell"); 
            if (this.record.getStepState(i)) { 
                cell.classList.add("active"); 
            } 
            cell.style.backgroundColor = this.record.getStepState(i) ? settings.active_color : settings.inactive_color; 
            cell.classList.add("grid-cell"); 
            cell.dataset.index = i; 
            cell.addEventListener("click", () => this.toggleCell(i, cell)); 
            gridContainer.appendChild(cell); 
        } 
 
        this.container.appendChild(gridContainer); 
    } 
 
    createControls() { 
        const controlsContainer = document.createElement("div"); 
        controlsContainer.className = "controls-container"; 
 
        this.playPauseBtn = document.createElement("button"); 
        this.playPauseBtn.innerText = "Play"; 
        this.playPauseBtn.addEventListener("click", () => this.togglePlayPause()); 
 
        this.stopBtn = document.createElement("button"); 
        this.stopBtn.innerText = "Stop"; 
        this.stopBtn.addEventListener("click", () => this.stop()); 
 
        this.bpmInput = document.createElement("input"); 
        this.bpmInput.type = "number"; 
        this.bpmInput.value = this.bpm; 
        this.bpmInput.min = 30; 
        this.bpmInput.max = 300; 
        this.bpmInput.addEventListener("input", (e) => this.changeBPM(parseInt(e.target.value, 10))); 
 
        controlsContainer.appendChild(this.playPauseBtn); 
        controlsContainer.appendChild(this.stopBtn); 
        controlsContainer.appendChild(this.bpmInput); 
        this.container.appendChild(controlsContainer); 
    } 
 
    changeBPM(newBPM) { 
        if (newBPM < 30 || newBPM > 300) return; 
 
        console.log(`Changing BPM to ${newBPM}`); 
        // let was_playing = false; 
        // if (this.isPlaying) { 
        //     this.pause(); 
        //     was_playing = true; 
        // } 
 
        this.bpm = newBPM; 
        this.noteInterval = this.calculateNoteInterval(); 
 
        // if (was_playing) { 
        //     this.start(); 
        // } 
    } 
 
    togglePlayPause() { 
        if (this.isPlaying) { 
            this.pause(); 
            this.playPauseBtn.innerText = "Play"; 
        } else { 
            this.start(); 
            this.playPauseBtn.innerText = "Pause"; 
        } 
    } 
 
    toggleCell(step, cell) { 
        this.record.toggleStep(step); 
        cell.classList.toggle("active"); 
        cell.style.backgroundColor = this.record.getStepState(step) ? settings.active_color : settings.inactive_color; 
    } 
 
    start() { 
        if (this.isPlaying) return; 
        this.isPlaying = true; 
 
        if (this.isPaused) { 
            this.nextNoteTime += this.currentTime - this.lastPauseTime; 
            this.isPaused = false; 
        } else { 
            this.nextNoteTime = this.currentTime; 
        } 
        // this.nextNoteTime = this.currentTime + this.pauseOffset * this.noteInterval; 
        // this.pauseOffset = 0.0; 
 
        this.scheduleNextNotes(); 
        this.intervalId = setInterval(() => this.scheduleNextNotes(), 25); 
    } 
 
    pause() { 
        if (!this.isPlaying) return; 
 
        clearInterval(this.intervalId); 
        this.isPlaying = false; 
        this.isPaused = true; 
        this.lastPauseTime = this.currentTime; 
 
        // const elapsedTime = this.currentTime - this.lastStartTime; 
        // this.pauseOffset = (this.nextNoteTime - this.currentTime) / this.noteInterval; 
 
        // this.clearScheduledNotes(); 
    } 
 
    stop() { 
        clearInterval(this.intervalId); 
        this.isPlaying = false; 
        this.isPaused = false; 
        this.nextStep = 0; 
        // this.pauseOffset = 0.0; 
        this.playPauseBtn.innerText = "Play"; 
 
        // this.clearScheduledNotes(); 
        this.highlightStep(null); 
    } 
 
    scheduleNextNotes() { 
        while (this.nextNoteTime < this.currentTime + settings.schedule_ahead_time) { 
            console.log(`Sched step=${this.nextStep} time=${this.nextNoteTime.toFixed(4)}s`); 
            if (this.record.getStepState(this.nextStep)) { 
                this.playNote(this.nextStep, this.nextNoteTime); 
            } 
            this.nextNoteTime += this.noteInterval; 
            this.nextStep = (this.nextStep + 1) % this.record.totalSteps; 
        } 
    } 
 
    playNote(step, time) { 
        const source = this.audio.startBuffer(this.record.soundName, time); 
        // this.scheduledAudioNodes.push({source, time}); 
 
        const visualTimeout = setTimeout(() => { 
            this.highlightStep(step); 
        }, (time - this.currentTime) * 1000); 
 
        // this.scheduleTimeouts.push(visualTimeout); 
    } 
 
    highlightStep(step) { 
        const cells = this.container.querySelectorAll(".grid-cell"); 
        cells.forEach((cell, i) => { 
            cell.style.backgroundColor = 
                i === step ? settings.playing_color : this.record.getStepState(i) ? settings.active_color : settings.inactive_color; 
        }); 
        this.lastHightlightedStep = step; 
    } 
 
    clearScheduledNotes() { 
        this.scheduledAudioNodes.forEach(({source, time}) => { 
            if (time - this.currentTime > settings.schedule_ahead_time) { 
                try { 
                    source.stop(); 
                    source.disconnect(); 
                } catch (e) { 
                    console.error("Error stopping audio:", e); 
                } 
            } 
        }); 
        this.scheduledAudioNodes = []; 
 
        this.scheduleTimeouts.forEach((id) => clearTimeout(id)); 
        this.scheduleTimeouts = []; 
    } 
 
    update() { 
        this.highlightStep(this.lastHightlightedStep); 
    } 
}</script> <script>class Dragging { 
    constructor(element) { 
        this.dragging = false; 
        this.dragged_element = null; 
        this.start_x = 0; 
        this.start_y = 0; 
 
        this.setup(element || document.body); 
 
        this.find_target = (event_target) => { event_target.closest(".draggable") }; 
        this.move_element = (elem, x, y) => elem.style.transform = `translate(${x}px, ${y}px)`; 
        this.drop_element = (elem) => elem.style.transform = ""; 
    } 
 
    setup(elem) { 
        elem.addEventListener("pointerdown", (event) => this.start(event)); 
        elem.addEventListener("pointermove", (event) => this.move(event)); 
        elem.addEventListener("pointerup", () => this.stop()); 
        elem.addEventListener("pointercancel", () => this.stop()); 
    } 
 
    start(event) { 
        if (this.dragging) this.stop(); 
        this.dragging = true; 
        this.dragged_element = event.target; 
        this.start_x = event.clientX; // - this.dragged_element.getBoundingClientRect().left; 
        this.start_y = event.clientY; // - this.dragged_element.getBoundingClientRect().top; 
    } 
 
    move(event) { 
        if (this.dragging) { 
            event.preventDefault(); 
 
            if (this.dragged_element) { 
                const x = event.clientX - this.start_x; 
                const y = event.clientY - this.start_y; 
 
                this.move_element(this.dragged_element, x, y); 
            } 
        } 
    } 
 
    stop() { 
        if (this.dragged_element) { 
            this.drop_element(this.dragged_element); 
        } 
        this.dragging = false; 
    }
